<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="description" content="Professional Portfolio - Developer & Designer">
    <meta name="theme-color" content="#050505">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta name="robots" content="index, follow">
    <title>Portfolio | Welcome</title>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-pink: #ff0055;
            --bg-dark: #050505;
            /* Darker black for contrast */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-dark);
            font-family: 'Outfit', 'Segoe UI', sans-serif;
            /* Cleaner font */
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            display: none;
        }

        .container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 70px;
            height: 70px;
            background: var(--bg-dark);
            z-index: 50;
            pointer-events: none;
        }

        .explore-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--neon-cyan);
            background: transparent;
            border: 2px solid var(--neon-cyan);
            border-radius: 8px;
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 0 10px var(--neon-cyan));
            font-family: inherit;
        }

        .explore-btn:hover {
            background: rgba(0, 243, 255, 0.1);
            transform: translate(-50%, -50%) scale(1.05);
            filter: drop-shadow(0 0 20px var(--neon-cyan));
        }

        .explore-btn.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.8);
        }

        .flow-content {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease;
            pointer-events: none;
        }

        .flow-content.active {
            display: block;
            opacity: 1;
            pointer-events: auto;
        }

        .svg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            /* Allow clicks through SVG */
        }

        /* NEON LINES */
        .main-line {
            stroke: var(--neon-cyan);
            /* Cyan vertical line */
            stroke-width: 2;
            fill: none;
            filter: drop-shadow(0 0 5px var(--neon-cyan));
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            transition: stroke-dashoffset 0.8s cubic-bezier(0.77, 0, 0.175, 1);
            /* Intense Ease */
            opacity: 0.8;
        }

        .branch-line {
            stroke: url(#lineGradient);
            stroke-width: 3;
            fill: none;
            stroke-dasharray: 3000;
            stroke-dashoffset: 3000;
            stroke-linejoin: round;
            stroke-linecap: round;
            filter: drop-shadow(0 0 0 transparent);
            opacity: 0;
            transition: stroke-dashoffset 1.2s cubic-bezier(0.4, 0, 0.2, 1),
                filter 0.5s ease,
                opacity 0.3s ease;
        }

        .circuit-node {
            fill: var(--neon-cyan);
            filter: drop-shadow(0 0 5px var(--neon-cyan));
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .flow-content.active .circuit-node {
            opacity: 1;
            transition-delay: 1s;
            /* Show after lines draw */
            animation: nodePulse 2s infinite alternate;
        }

        @keyframes nodePulse {
            0% {
                fill: var(--neon-cyan);
                r: 2;
            }

            100% {
                fill: #fff;
                r: 3;
                filter: drop-shadow(0 0 8px #fff);
            }
        }

        .flow-content.active .main-line {
            stroke-dashoffset: 0;
            filter: drop-shadow(0 0 15px var(--neon-cyan));
            /* Flash effect */
        }

        .flow-content.active .branch-line {
            opacity: 1;
            stroke-dashoffset: 0;
            filter: drop-shadow(0 0 8px var(--neon-pink)) drop-shadow(0 0 20px var(--neon-pink));
            animation: lineGlow 2s ease-in-out infinite alternate;
        }

        @keyframes lineGlow {
            0% {
                filter: drop-shadow(0 0 8px var(--neon-pink)) drop-shadow(0 0 15px var(--neon-pink));
            }

            100% {
                filter: drop-shadow(0 0 15px var(--neon-pink)) drop-shadow(0 0 30px var(--neon-pink)) brightness(1.2);
            }
        }

        /* Staggered line appearance - one by one from top */
        .flow-content.active .branch-line:nth-of-type(1) {
            transition-delay: 0s;
            animation-delay: 0s;
        }

        .flow-content.active .branch-line:nth-of-type(2) {
            transition-delay: 0.4s;
            animation-delay: 0.4s;
        }

        .flow-content.active .branch-line:nth-of-type(3) {
            transition-delay: 0.8s;
            animation-delay: 0.8s;
        }

        .flow-content.active .branch-line:nth-of-type(4) {
            transition-delay: 1.2s;
            animation-delay: 1.2s;
        }

        /* PARTICLES */
        .particle {
            fill: white;
            filter: drop-shadow(0 0 2px white);
            opacity: 0;
        }

        .flow-content.active .particle {
            opacity: 1;
        }

        /* DIAMONDS */
        .diamond-group {
            opacity: 0;
            transform: scale(0);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center;
        }

        .flow-content.active .diamond-group {
            opacity: 1;
            transform: scale(1);
        }

        .flow-content.active .diamond-group:nth-child(2) {
            transition-delay: 0.2s;
        }

        /* Main line first */
        .flow-content.active .diamond-group:nth-child(3) {
            transition-delay: 0.4s;
        }

        .flow-content.active .diamond-group:nth-child(4) {
            transition-delay: 0.6s;
        }

        .flow-content.active .diamond-group:nth-child(5) {
            transition-delay: 0.8s;
        }

        .diamond-shape {
            fill: rgba(10, 10, 15, 0.8);
            stroke: var(--neon-cyan);
            stroke-width: 2;
            filter: drop-shadow(0 0 8px var(--neon-cyan));
        }

        .diamond-center {
            fill: var(--neon-cyan);
            filter: drop-shadow(0 0 4px white);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.5;
                r: 3;
            }

            50% {
                opacity: 1;
                r: 5;
            }

            100% {
                opacity: 0.5;
                r: 3;
            }
        }

        /* LABELS */
        .nav-label {
            position: absolute;
            opacity: 0;
            transform: translateX(-20px);
            transition: all 0.5s ease;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 0, 85, 0.3);
            backdrop-filter: blur(5px);
            padding: 8px 20px;
            border-radius: 6px;
            /* Slightly smoother corners */
            /* Removed clip-path for perfect rectangle */
        }

        .flow-content.active .nav-label {
            opacity: 1;
            transform: translateX(0);
        }

        /* Staggered labels - sync with lines */
        .flow-content.active #label-projects {
            transition-delay: 0.8s;
        }

        .flow-content.active #label-repos {
            transition-delay: 1.2s;
        }

        .flow-content.active #label-contact {
            transition-delay: 1.6s;
        }

        .flow-content.active #label-about {
            transition-delay: 2.0s;
        }

        .nav-label a {
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 5px rgba(255, 0, 85, 0.5);
            transition: all 0.3s;
            display: block;
        }

        .nav-label:hover {
            background: rgba(255, 0, 85, 0.15);
            border-color: var(--neon-pink);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
            transform: translateX(5px);
        }

        .nav-label:hover a {
            text-shadow: 0 0 10px var(--neon-pink);
        }

        .color-palette {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: rgba(10, 10, 15, 0.95);
            border: 1px solid rgba(0, 243, 255, 0.3);
            padding: 12px 25px;
            border-radius: 12px;
            backdrop-filter: blur(20px);
            z-index: 200;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 243, 255, 0.1);
        }

        .color-palette:hover {
            border-color: rgba(0, 243, 255, 0.5);
        }

        .mode-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            background: rgba(10, 10, 15, 0.95);
            border: 2px solid var(--neon-cyan);
            border-radius: 10px;
            color: var(--neon-cyan);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 200;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 0 10px var(--neon-cyan));
            user-select: none;
        }

        .mode-indicator:hover {
            background: rgba(0, 243, 255, 0.15);
            transform: scale(1.05);
            filter: drop-shadow(0 0 20px var(--neon-cyan));
        }

        .mode-indicator:active {
            transform: scale(0.95);
        }

        .mode-indicator::before {
            content: '';
            position: absolute;
            inset: -4px;
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 14px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .mode-indicator:hover::before {
            opacity: 1;
            animation: borderPulse 1.5s ease-in-out infinite;
        }

        @keyframes borderPulse {

            0%,
            100% {
                opacity: 0.3;
            }

            50% {
                opacity: 0.8;
            }
        }

        .palette-label {
            font-size: 10px;
            letter-spacing: 2px;
            color: #888;
            font-weight: 700;
        }

        .palette-controls {
            display: flex;
            gap: 25px;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .control-item span {
            font-size: 9px;
            color: #666;
            letter-spacing: 1px;
        }

        .control-item:hover span {
            color: #fff;
        }

        .color-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .color-dot.red {
            background: #ff0055;
        }

        .color-dot.yellow {
            background: #ffcc00;
        }

        .color-dot.green {
            background: #00ff99;
        }

        .color-dot.cyan {
            background: #00f3ff;
        }

        .control-item:hover .color-dot {
            transform: scale(1.3);
        }

        /* INTRO OVERLAY - ENHANCED */
        .intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 500;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.8s ease;
            background: radial-gradient(ellipse at center, rgba(0, 243, 255, 0.12) 0%, rgba(5, 5, 5, 0.98) 70%);
            overflow: hidden;
        }

        .intro-overlay.visible {
            display: flex;
            opacity: 1;
        }

        /* Cyber Grid Background */
        .intro-overlay::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background:
                linear-gradient(90deg, rgba(0, 243, 255, 0.04) 1px, transparent 1px),
                linear-gradient(rgba(0, 243, 255, 0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridPan 25s linear infinite;
            transform: perspective(500px) rotateX(60deg);
            transform-origin: center center;
        }

        .intro-overlay::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 243, 255, 0.015) 2px,
                    rgba(0, 243, 255, 0.015) 4px);
            animation: scanMove 3s linear infinite;
            pointer-events: none;
        }

        @keyframes gridPan {
            0% {
                transform: perspective(500px) rotateX(60deg) translateY(0);
            }

            100% {
                transform: perspective(500px) rotateX(60deg) translateY(60px);
            }
        }

        @keyframes scanMove {
            0% {
                transform: translateY(-100%);
            }

            100% {
                transform: translateY(100%);
            }
        }

        /* Main Content */
        .intro-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 50px;
        }

        /* Intro Text - Clean & Readable */
        .intro-text {
            font-size: clamp(14px, 3vw, 22px);
            font-weight: 600;
            color: #fff;
            text-align: center;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s;
            text-shadow: 0 0 20px var(--neon-cyan), 0 0 40px rgba(0, 243, 255, 0.5);
            padding: 0 20px;
            max-width: 90vw;
            line-height: 1.6;
        }

        .intro-overlay.visible .intro-text {
            opacity: 1;
            transform: translateY(0);
        }

        /* Arrow Container */
        .intro-arrow-container {
            position: relative;
            width: 85vw;
            max-width: 700px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .intro-arrow-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .intro-arrow-line {
            stroke: url(#introGradient);
            stroke-width: 5;
            fill: none;
            filter: drop-shadow(0 0 15px var(--neon-cyan)) drop-shadow(0 0 30px var(--neon-cyan));
            stroke-dasharray: 500;
            stroke-dashoffset: 500;
            stroke-linecap: round;
        }

        .intro-overlay.visible .intro-arrow-line {
            animation: drawArrow 1.2s cubic-bezier(0.65, 0, 0.35, 1) 0.5s forwards;
        }

        @keyframes drawArrow {
            to {
                stroke-dashoffset: 0;
            }
        }

        .intro-arrow-head {
            fill: var(--neon-cyan);
            filter: drop-shadow(0 0 10px var(--neon-cyan)) drop-shadow(0 0 25px var(--neon-cyan));
            opacity: 0;
            transform: translateX(-20px) scale(0);
            transform-origin: center;
        }

        .intro-overlay.visible .intro-arrow-head {
            animation: headAppear 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 1.6s forwards,
                headPulse 1s ease-in-out 2.2s infinite alternate;
        }

        @keyframes headAppear {
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        @keyframes headPulse {
            0% {
                filter: drop-shadow(0 0 10px var(--neon-cyan)) drop-shadow(0 0 25px var(--neon-cyan));
                transform: scale(1);
            }

            100% {
                filter: drop-shadow(0 0 20px var(--neon-cyan)) drop-shadow(0 0 40px var(--neon-cyan));
                transform: scale(1.2);
            }
        }

        /* Energy Particles */
        .arrow-particle {
            fill: var(--neon-cyan);
            opacity: 0;
            filter: drop-shadow(0 0 5px var(--neon-cyan));
        }

        .intro-overlay.visible .arrow-particle {
            animation: particleMove 1.8s linear 0.6s infinite;
        }

        .intro-overlay.visible .arrow-particle:nth-child(2) {
            animation-delay: 1s;
        }

        .intro-overlay.visible .arrow-particle:nth-child(3) {
            animation-delay: 1.4s;
        }

        @keyframes particleMove {
            0% {
                opacity: 0;
                transform: translateX(0);
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform: translateX(420px);
            }
        }

        /* Pulse Rings */
        .intro-pulse {
            position: absolute;
            width: 80px;
            height: 80px;
            border: 2px solid var(--neon-cyan);
            border-radius: 50%;
            opacity: 0;
        }

        .intro-overlay.visible .intro-pulse {
            animation: ringPulse 2.5s cubic-bezier(0.19, 1, 0.22, 1) infinite;
        }

        .intro-pulse.p2 {
            animation-delay: 0.7s !important;
            border-color: var(--neon-cyan);
            opacity: 0.7;
        }

        .intro-pulse.p3 {
            animation-delay: 1.4s !important;
        }

        @keyframes ringPulse {
            0% {
                transform: scale(0.2);
                opacity: 1;
            }

            100% {
                transform: scale(6);
                opacity: 0;
            }
        }

        /* Corner Decorations */
        .intro-corner {
            position: absolute;
            width: 50px;
            height: 50px;
            border: 2px solid var(--neon-cyan);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 0 6px var(--neon-cyan));
        }

        .intro-corner.tl {
            top: 6%;
            left: 6%;
            border-right: none;
            border-bottom: none;
            transform: translate(-15px, -15px);
        }

        .intro-corner.tr {
            top: 6%;
            right: 6%;
            border-left: none;
            border-bottom: none;
            transform: translate(15px, -15px);
        }

        .intro-corner.bl {
            bottom: 6%;
            left: 6%;
            border-right: none;
            border-top: none;
            transform: translate(-15px, 15px);
        }

        .intro-corner.br {
            bottom: 6%;
            right: 6%;
            border-left: none;
            border-top: none;
            transform: translate(15px, 15px);
        }

        .intro-overlay.visible .intro-corner {
            opacity: 0.8;
            transform: translate(0, 0);
        }

        .intro-overlay.visible .intro-corner.tl {
            transition-delay: 0.1s;
        }

        .intro-overlay.visible .intro-corner.tr {
            transition-delay: 0.2s;
        }

        .intro-overlay.visible .intro-corner.bl {
            transition-delay: 0.3s;
        }

        .intro-overlay.visible .intro-corner.br {
            transition-delay: 0.4s;
        }

        /* Floating Particles */
        .float-particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--neon-cyan);
            border-radius: 50%;
            opacity: 0;
            box-shadow: 0 0 8px var(--neon-cyan);
        }

        .intro-overlay.visible .float-particle {
            animation: floatRise 3.5s ease-in-out infinite;
        }

        .float-particle:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
        }

        .float-particle:nth-child(2) {
            left: 25%;
            animation-delay: 0.4s;
        }

        .float-particle:nth-child(3) {
            left: 40%;
            animation-delay: 0.8s;
        }

        .float-particle:nth-child(4) {
            left: 55%;
            animation-delay: 1.2s;
        }

        .float-particle:nth-child(5) {
            left: 70%;
            animation-delay: 1.6s;
        }

        .float-particle:nth-child(6) {
            left: 85%;
            animation-delay: 2s;
        }

        @keyframes floatRise {
            0% {
                bottom: -5px;
                opacity: 0;
                transform: scale(0.5);
            }

            15% {
                opacity: 1;
            }

            85% {
                opacity: 1;
            }

            100% {
                bottom: 105%;
                opacity: 0;
                transform: scale(1.2);
            }
        }

        /* Exit Animation */
        .intro-overlay.exit {
            opacity: 0;
            transform: scale(1.08);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .intro-overlay.exit .intro-content {
            transform: scale(0.95);
            opacity: 0;
            transition: all 0.3s ease-out;
        }
    </style>
</head>

<body>
    <div class="container">
        <button class="explore-btn" id="exploreBtn">Click here to explore</button>

        <div class="flow-content" id="flowContent">
            <svg class="svg-layer" id="svgLayer"></svg>
            <div class="mode-indicator" id="modeIndicator">CIRCUIT MODE</div>

            <div class="nav-label" id="label-projects"><a href="projects.html">Projects</a></div>
            <div class="nav-label" id="label-repos"><a href="repos.html">Repositories</a></div>
            <div class="nav-label" id="label-contact"><a href="contact.html">Contact</a></div>
            <div class="nav-label" id="label-about"><a href="about.html">About</a></div>

            <div class="color-palette">
                <div class="palette-label">CURVE</div>
                <div class="palette-controls">
                    <div class="control-item">
                        <div class="color-dot red" title="Circuit Board"></div>
                        <span>CIRCUIT</span>
                    </div>
                    <div class="control-item">
                        <div class="color-dot yellow" title="Direct Line"></div>
                        <span>DIRECT</span>
                    </div>
                    <div class="control-item">
                        <div class="color-dot green" title="Organic Curve"></div>
                        <span>CURVE</span>
                    </div>
                    <div class="control-item">
                        <div class="color-dot cyan" title="System Glitch"></div>
                        <span>GLITCH</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- INTRO ARROW OVERLAY -->
    <div class="intro-overlay" id="introOverlay">

    <style>
        /* TRANSITION OVERLAY STYLES */
        .page-transition-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10000;
            display: flex;
            flex-direction: column;
        }

        .shutter {
            background: #ff0055;
            width: 100%;
            height: 25%;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.5s cubic-bezier(0.8, 0, 0.2, 1);
        }

        .shutter:nth-child(2) {
            background: #00f3ff;
            transition-delay: 0.1s;
        }

        .shutter:nth-child(3) {
            background: #ff0055;
            transition-delay: 0.2s;
        }

        .shutter:nth-child(4) {
            background: #00f3ff;
            transition-delay: 0.3s;
        }

        .page-transition-overlay.active .shutter {
            transform: scaleX(1);
            pointer-events: auto;
        }

        /* ========================================

            .flow-content,
            .explore-btn,

                position: absolute;

        .mobile-logo {

        .mobile-card.yellow:active {

    <script>
        // --- CURSOR TRAIL LOGIC ---
        const cursorCanvas = document.getElementById('cursorCanvas');
        const ctx = cursorCanvas.getContext('2d');
        let width, height;
        let mouse = { x: -100, y: -100 };
        let trail = [];
        const TRAIL_LENGTH = 30;

        function resizeCanvas() {
            width = cursorCanvas.width = window.innerWidth;
            height = cursorCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        function animateCursor() {
            ctx.clearRect(0, 0, width, height);

            // Add point
            trail.push({ x: mouse.x, y: mouse.y });
            if (trail.length > TRAIL_LENGTH) trail.shift();

            // Draw Trail
            if (trail.length > 2) {
                ctx.beginPath();
                ctx.moveTo(trail[0].x, trail[0].y);

                for (let i = 1; i < trail.length - 1; i++) {
                    const xc = (trail[i].x + trail[i + 1].x) / 2;
                    const yc = (trail[i].y + trail[i + 1].y) / 2;
                    ctx.quadraticCurveTo(trail[i].x, trail[i].y, xc, yc);
                }
                ctx.quadraticCurveTo(
                    trail[trail.length - 1].x, trail[trail.length - 1].y,
                    trail[trail.length - 1].x, trail[trail.length - 1].y
                );

                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                // Create gradient for trail
                const gradient = ctx.createLinearGradient(
                    trail[0].x, trail[0].y,
                    trail[trail.length - 1].x, trail[trail.length - 1].y
                );
                gradient.addColorStop(0, 'rgba(255, 0, 85, 0)');
                gradient.addColorStop(1, 'rgba(255, 0, 85, 0.8)');

                ctx.strokeStyle = gradient;
                ctx.lineWidth = 3;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff0055';
                ctx.stroke();
            }

            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // --- PAGE TRANSITION LOGIC ---
        const isMobileDevice = window.innerWidth <= 768;
        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', function (e) {
                // Skip animation on mobile - allow direct navigation
                if (isMobileDevice) return;

                e.preventDefault();
                const target = this.getAttribute('href');

                // Trigger animation
                document.querySelector('.page-transition-overlay').classList.add('active');

                // Wait for animation then navigate
                setTimeout(() => {
                    window.location.href = target;
                }, 800); // 0.5s animation + 0.3s delay
            });
        });

        const exploreBtn = document.getElementById('exploreBtn');
        const flowContent = document.getElementById('flowContent');
        const svgLayer = document.getElementById('svgLayer');
        const introOverlay = document.getElementById('introOverlay');
        let isActive = false;
        let introShown = false;

        const showDiagram = () => {
            flowContent.classList.add('active');
            drawDiagram();
        };

        const runIntro = () => {
            introOverlay.classList.add('visible');
            setTimeout(() => {
                introOverlay.classList.add('exit');
                setTimeout(() => {
                    introOverlay.style.display = 'none';
                    showDiagram();
                }, 500);
            }, 4500);
        };

        exploreBtn.addEventListener('click', () => {
            if (isActive) return;
            isActive = true;
            exploreBtn.classList.add('hidden');
            introShown ? showDiagram() : (introShown = true, runIntro());
        });

        // Global state for current pattern
        let currentPattern = 'circuit';
        const patterns = ['circuit', 'direct', 'curve', 'glitch'];

        // Function to update visual state
        function updatePatternVisuals(patternIndex) {
            const modeIndicator = document.getElementById('modeIndicator');
            if (modeIndicator) {
                modeIndicator.textContent = patterns[patternIndex].toUpperCase() + ' MODE';
            }

            // Update palette label
            const paletteLabel = document.querySelector('.palette-label');
            if (paletteLabel) {
                paletteLabel.textContent = patterns[patternIndex].toUpperCase();
            }

            // Reset all dots
            document.querySelectorAll('.control-item .color-dot').forEach(d => {
                d.style.transform = 'scale(1)';
                d.style.boxShadow = '0 0 10px rgba(0,0,0,0.5)';
            });
            document.querySelectorAll('.control-item span').forEach(s => s.style.color = '#666');

            // Highlight active
            const activeItem = document.querySelectorAll('.control-item')[patternIndex];
            if (activeItem) {
                const dot = activeItem.querySelector('.color-dot');
                const label = activeItem.querySelector('span');
                if (dot) {
                    dot.style.transform = 'scale(1.5)';
                    dot.style.boxShadow = '0 0 15px currentColor';
                }
                if (label) label.style.color = '#fff';
            }
        }

        // Mode indicator click - cycle through patterns
        document.getElementById('modeIndicator').addEventListener('click', (e) => {
            e.stopPropagation();
            const currentIndex = patterns.indexOf(currentPattern);
            const nextIndex = (currentIndex + 1) % patterns.length;
            currentPattern = patterns[nextIndex];

            updatePatternVisuals(nextIndex);

            if (isActive) {
                drawDiagram();
            }
        });

        // Listen to control item clicks
        document.querySelectorAll('.control-item').forEach((item, index) => {
            item.addEventListener('click', (e) => {
                e.stopPropagation();
                currentPattern = patterns[index] || 'circuit';

                updatePatternVisuals(index);

                if (isActive) {
                    drawDiagram();
                }
            });
        });

        function drawDiagram() {
            const w = window.innerWidth;
            const h = window.innerHeight;

            // X positions
            const leftX = 80;
            const diamondSize = 18;

            // Y positions are constant
            // Adjusted to leave space at bottom for Control Panel
            const d1y = Math.max(h * 0.12, 120);
            const d2y = Math.max(h * 0.30, d1y + 80);
            const d3y = Math.max(h * 0.48, d2y + 80);
            const d4y = Math.max(h * 0.66, d3y + 80);

            const rightX = w * 0.65;

            const projY = Math.max(h * 0.17, d1y + 30);
            const repoY = Math.max(h * 0.35, d2y + 30);
            const contY = Math.max(h * 0.53, d3y + 30);
            const abutY = Math.max(h * 0.71, d4y + 30);

            // Target X for the LINE (Arrow tip will be beyond this by ~10px)
            // Subtracting to account for refX=0 adjustment
            const endLineX = rightX - 12;

            // Lanes for circuit/glitch
            const lanes = [
                { x1: 100, x2: 180 },
                { x1: 220, x2: 300 },
                { x1: 340, x2: 420 },
                { x1: 460, x2: 540 }
            ];

            // --- PATTERN GENERATORS ---

            // 1. CIRCUIT (Tech Trace with Chamfers & Nodes)
            function getCircuitPath(sx, sy, lane, ey, ex) {
                const midY = sy + (ey - sy) * 0.5;
                const c = 15; // Chamfer size

                // M Start
                // L to Turn 1 Start
                // L to Turn 1 End (Diagonal)
                // L to Turn 2 Start
                // ...
                let path = `M ${sx} ${sy} `;
                path += `L ${lane.x1 - c} ${sy} L ${lane.x1} ${sy + c} `; // Corner 1
                path += `L ${lane.x1} ${midY - c} L ${lane.x1 + c} ${midY} `; // Corner 2
                path += `L ${lane.x2 - c} ${midY} L ${lane.x2} ${midY + c} `; // Corner 3
                path += `L ${lane.x2} ${ey - c} L ${lane.x2 + c} ${ey} `; // Corner 4
                path += `L ${ex} ${ey}`;
                return path;
            }

            // 2. DIRECT (Sharp & Clean)
            function getDirectPath(sx, sy, lane, ey, ex) {
                // Simple 90 degree step
                const midX = (sx + ex) * 0.5;
                return `M ${sx} ${sy} H ${lane.x2} V ${ey} H ${ex}`;
            }

            // 3. CURVE (Smooth Sigmoid)
            function getCurvePath(sx, sy, lane, ey, ex) {
                // Double Bezier for S-shape
                const midX = (sx + ex) * 0.5;
                const midY = (sy + ey) * 0.5;
                return `M ${sx} ${sy} 
                       C ${lane.x1} ${sy}, ${lane.x1} ${midY}, ${midX} ${midY}
                       S ${ex} ${ey}, ${ex} ${ey}`;
            }

            // 4. GLITCH (Random Stepped)
            function getGlitchPath(sx, sy, lane, ey, ex) {
                const midY = (sy + ey) / 2;
                const noise = () => (Math.random() - 0.5) * 30;
                // Jagged path
                return `M ${sx} ${sy} 
                        H ${lane.x1 + noise()} V ${midY + noise()} 
                        H ${lane.x2 + noise()} V ${ey + noise()} 
                        H ${ex}`;
            }

            let path1, path2, path3, path4;
            let nodesHTML = ''; // Only for circuit

            if (currentPattern === 'circuit') {
                path1 = getCircuitPath(leftX, d1y, lanes[0], projY, endLineX);
                path2 = getCircuitPath(leftX, d2y, lanes[1], repoY, endLineX);
                path3 = getCircuitPath(leftX, d3y, lanes[2], contY, endLineX);
                path4 = getCircuitPath(leftX, d4y, lanes[3], abutY, endLineX);

                // Add tech nodes at chamfer points
                const createNodes = (lane, sy, ey) => {
                    const midY = sy + (ey - sy) * 0.5;
                    const c = 15;
                    // 8 points per line for max tech feels
                    return `
                        <!-- Corner 1 -->
                        <circle class="circuit-node" cx="${lane.x1 - c}" cy="${sy}" r="1.5" />
                        <circle class="circuit-node" cx="${lane.x1}" cy="${sy + c}" r="1.5" />
                        <!-- Corner 2 -->
                        <circle class="circuit-node" cx="${lane.x1}" cy="${midY - c}" r="1.5" />
                        <circle class="circuit-node" cx="${lane.x1 + c}" cy="${midY}" r="1.5" />
                        <!-- Corner 3 -->
                        <circle class="circuit-node" cx="${lane.x2 - c}" cy="${midY}" r="1.5" />
                        <circle class="circuit-node" cx="${lane.x2}" cy="${midY + c}" r="1.5" />
                        <!-- Corner 4 -->
                        <circle class="circuit-node" cx="${lane.x2}" cy="${ey - c}" r="1.5" />
                        <circle class="circuit-node" cx="${lane.x2 + c}" cy="${ey}" r="1.5" />
                    `;
                };
                nodesHTML = createNodes(lanes[0], d1y, projY) + createNodes(lanes[1], d2y, repoY) +
                    createNodes(lanes[2], d3y, contY) + createNodes(lanes[3], d4y, abutY);

            } else if (currentPattern === 'direct') {
                path1 = getDirectPath(leftX, d1y, lanes[0], projY, endLineX);
                path2 = getDirectPath(leftX, d2y, lanes[1], repoY, endLineX);
                path3 = getDirectPath(leftX, d3y, lanes[2], contY, endLineX);
                path4 = getDirectPath(leftX, d4y, lanes[3], abutY, endLineX);

            } else if (currentPattern === 'curve') {
                path1 = getCurvePath(leftX, d1y, lanes[0], projY, endLineX);
                path2 = getCurvePath(leftX, d2y, lanes[1], repoY, endLineX);
                path3 = getCurvePath(leftX, d3y, lanes[2], contY, endLineX);
                path4 = getCurvePath(leftX, d4y, lanes[3], abutY, endLineX);

            } else { // GLITCH
                path1 = getGlitchPath(leftX, d1y, lanes[0], projY, endLineX);
                path2 = getGlitchPath(leftX, d2y, lanes[1], repoY, endLineX);
                path3 = getGlitchPath(leftX, d3y, lanes[2], contY, endLineX);
                path4 = getGlitchPath(leftX, d4y, lanes[3], abutY, endLineX);
            }


            svgLayer.innerHTML = `
                <defs>
                    <!-- Sleek Cyber Arrow (Stealth) -->
                    <!-- refX=0 means the line stops at the very back (x=0) of the arrow -->
                    <marker id="arrow" viewBox="0 0 12 12" refX="0" refY="6" 
                            markerWidth="10" markerHeight="10" orient="auto">
                        <path d="M 0 2 L 10 6 L 0 10 L 3 6 z" fill="#ff0055"/>
                    </marker>
                    
                    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#00f3ff;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#ff0055;stop-opacity:1" />
                    </linearGradient>
                </defs>

                <!-- Main Vertical Line -->
                <line class="main-line" x1="${leftX}" y1="${d1y}" x2="${leftX}" y2="${h - 40}"/>

                <!-- Circuit Nodes (Only if circuit pattern) -->
                <g class="circuit-group">${nodesHTML}</g>

                <!-- Branch Lines (Paths) -->
                <!-- Subtracting offset from rightX to allow space for arrow body -->
                <path id="p1" class="branch-line" d="${path1}" marker-end="url(#arrow)" />
                <path id="p2" class="branch-line" d="${path2}" marker-end="url(#arrow)" />
                <path id="p3" class="branch-line" d="${path3}" marker-end="url(#arrow)" />
                <path id="p4" class="branch-line" d="${path4}" marker-end="url(#arrow)" />

                <!-- Diamonds (Groups) -->
                <g class="diamond-group" transform="translate(${leftX}, ${d1y}) rotate(45)">
                    <rect class="diamond-shape" x="${-diamondSize}" y="${-diamondSize}" width="${diamondSize * 2}" height="${diamondSize * 2}"/>
                    <circle class="diamond-center" cx="0" cy="0" r="4"/>
                </g>
                <g class="diamond-group" transform="translate(${leftX}, ${d2y}) rotate(45)">
                    <rect class="diamond-shape" x="${-diamondSize}" y="${-diamondSize}" width="${diamondSize * 2}" height="${diamondSize * 2}"/>
                    <circle class="diamond-center" cx="0" cy="0" r="4"/>
                </g>
                <g class="diamond-group" transform="translate(${leftX}, ${d3y}) rotate(45)">
                    <rect class="diamond-shape" x="${-diamondSize}" y="${-diamondSize}" width="${diamondSize * 2}" height="${diamondSize * 2}"/>
                    <circle class="diamond-center" cx="0" cy="0" r="4"/>
                </g>
                <g class="diamond-group" transform="translate(${leftX}, ${d4y}) rotate(45)">
                    <rect class="diamond-shape" x="${-diamondSize}" y="${-diamondSize}" width="${diamondSize * 2}" height="${diamondSize * 2}"/>
                    <circle class="diamond-center" cx="0" cy="0" r="4"/>
                </g>

                <!-- Flow Particles -->
                <circle class="particle" r="3"><animateMotion dur="3s" repeatCount="indefinite" path="${path1}" keyTimes="0;1" keyPoints="0;1"/></circle>
                <circle class="particle" r="3"><animateMotion dur="4s" repeatCount="indefinite" begin="0.5s" path="${path2}" keyTimes="0;1" keyPoints="0;1"/></circle>
                <circle class="particle" r="3"><animateMotion dur="3.5s" repeatCount="indefinite" begin="1s" path="${path3}" keyTimes="0;1" keyPoints="0;1"/></circle>
                <circle class="particle" r="3"><animateMotion dur="4.2s" repeatCount="indefinite" begin="0.2s" path="${path4}" keyTimes="0;1" keyPoints="0;1"/></circle>
            `;

            // Position labels
            const labelLeft = rightX + 25;
            document.getElementById('label-projects').style.cssText = `top: ${projY - 20}px; left: ${labelLeft}px;`;
            document.getElementById('label-repos').style.cssText = `top: ${repoY - 20}px; left: ${labelLeft}px;`;
            document.getElementById('label-contact').style.cssText = `top: ${contY - 20}px; left: ${labelLeft}px;`;
            document.getElementById('label-about').style.cssText = `top: ${abutY - 20}px; left: ${labelLeft}px;`;

            // Hover interactions (JS for path lighting)
            setupHoverEffect('label-projects', 'p1');
            setupHoverEffect('label-repos', 'p2');
            setupHoverEffect('label-contact', 'p3');
            setupHoverEffect('label-about', 'p4');
        }

        function setupHoverEffect(labelId, pathId) {
            const label = document.getElementById(labelId);
            const path = document.getElementById(pathId);

            label.addEventListener('mouseenter', () => {
                path.style.stroke = '#fff';
                path.style.filter = 'drop-shadow(0 0 10px #fff)';
                path.style.strokeWidth = '3';
            });

            label.addEventListener('mouseleave', () => {
                path.style.stroke = '';
                path.style.filter = '';
                path.style.strokeWidth = '';
            });
        }

        window.addEventListener('resize', () => {
            if (isActive) drawDiagram();
        });
    </script>
</body>

</html>
