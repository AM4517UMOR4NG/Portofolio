<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@500;700;900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="app" class="app-layout">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <div class="content-container">
                <h1 class="page-title">Notes</h1>
                <p class="page-subtitle">Recent GitHub activity and development updates</p>
                
                <div id="github-activity">
                    <div class="note-card">
                        <p class="date">Loading...</p>
                        <h3>Fetching GitHub Activity</h3>
                        <p>Please wait while we load your recent commits and updates...</p>
                    </div>
                </div>
            </div>
        </main>
        
        <script>
            async function fetchGitHubActivity() {
                const container = document.getElementById('github-activity');
                try {
                    const response = await fetch('https://api.github.com/users/AM4517UMOR4NG/events?per_page=10');
                    const events = await response.json();
                    
                    if (Array.isArray(events) && events.length > 0) {
                        const noteCards = events
                            .filter(event => ['PushEvent', 'CreateEvent', 'PullRequestEvent'].includes(event.type))
                            .slice(0, 6)
                            .map(event => {
                                const date = new Date(event.created_at);
                                const formattedDate = date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
                                
                                let title = '';
                                let description = '';
                                const repoName = event.repo.name.replace('AM4517UMOR4NG/', '');
                                
                                if (event.type === 'PushEvent') {
                                    const commits = event.payload.commits || [];
                                    title = `Push to ${repoName}`;
                                    description = commits.length > 0 
                                        ? commits[0].message 
                                        : `${commits.length} commits pushed`;
                                } else if (event.type === 'CreateEvent') {
                                    title = `Created ${event.payload.ref_type} in ${repoName}`;
                                    description = event.payload.description || `New ${event.payload.ref_type} created`;
                                } else if (event.type === 'PullRequestEvent') {
                                    title = `PR ${event.payload.action} in ${repoName}`;
                                    description = event.payload.pull_request?.title || 'Pull request activity';
                                }
                                
                                return `
                                    <a href="https://github.com/${event.repo.name}" target="_blank" class="note-card" style="text-decoration: none; display: block; cursor: pointer;">
                                        <p class="date">${formattedDate}</p>
                                        <h3>${title}</h3>
                                        <p>${description.substring(0, 150)}${description.length > 150 ? '...' : ''}</p>
                                    </a>
                                `;
                            }).join('');
                        
                        container.innerHTML = noteCards || '<div class="note-card"><p class="date">No recent activity</p><h3>All caught up!</h3><p>No recent development activity to display.</p></div>';
                    } else {
                        container.innerHTML = '<div class="note-card"><p class="date">Error</p><h3>Could not load activity</h3><p>Unable to fetch GitHub activity at this time.</p></div>';
                    }
                } catch (error) {
                    container.innerHTML = '<div class="note-card"><p class="date">Error</p><h3>Connection failed</h3><p>Unable to connect to GitHub API.</p></div>';
                }
            }
            
            document.addEventListener('DOMContentLoaded', fetchGitHubActivity);
        </script>
        <div class="cursor-dot"></div>
        <div class="cursor-outline"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
